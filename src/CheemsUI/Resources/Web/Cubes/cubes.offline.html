<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>CheemsCubesBackground 离线参考</title>
<style>
/* From Uiverse.io by csemszepp —— 原版 CSS 原样保存，仅外层包装页面结构。 */
html, body { margin: 0; height: 100%; }
.container {
  width: 100%;
  height: 100%;
  --s: 150px; /* control the size */
  --c1: #ff847c;
  --c2: #e84a5f;
  --c3: #fecea8;
  --c4: #99b898;

  background: conic-gradient(
      from 45deg at 75% 75%,
      var(--c3) 90deg,
      var(--c1) 0 180deg,
      #0000 0
    ),
    conic-gradient(from -45deg at 25% 25%, var(--c3) 90deg, #0000 0),
    conic-gradient(from -45deg at 50% 100%, #0000 180deg, var(--c3) 0),
    conic-gradient(
      from -45deg,
      var(--c1) 90deg,
      var(--c2) 0 225deg,
      var(--c4) 0
    );
  background-size: var(--s) var(--s);
}
</style>
</head>
<body>
<!-- From Uiverse.io by csemszepp -->
<div class="container"></div>
</body>
</html>
