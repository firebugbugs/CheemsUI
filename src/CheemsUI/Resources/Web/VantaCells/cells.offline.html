<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Vanta CELLS · Offline</title>
  <style>
    html, body, #cells-background { width: 100%; height: 100%; margin: 0; overflow: hidden; }
  </style>
</head>
<body>
  <div id="cells-background"></div>
  <!-- 仅引用同目录的固定本地副本；运行时不访问 CDN。 -->
  <script src="three.r134.min.js"></script>
  <script src="vanta.cells.min.js"></script>
  <script>
    const isPreview = new URLSearchParams(location.search).has("preview");
    let previewFrozen = false;
    const cells = VANTA.CELLS({
      el: "#cells-background",
      mouseControls: true,
      touchControls: true,
      gyroControls: false,
      minHeight: 200.00,
      minWidth: 200.00,
      scale: 1.00
    });

    if (isPreview) {
      setTimeout(function () {
        requestAnimationFrame(function () {
          if (previewFrozen || !cells.renderer) return;
          try {
            cells.renderer.render(cells.scene, cells.camera);
            const image = new Image();
            image.src = cells.renderer.domElement.toDataURL("image/png");
            image.style.cssText = "width:100%;height:100%;display:block;object-fit:cover";
            const renderer = cells.renderer;
            cells.destroy();
            renderer.dispose?.();
            renderer.forceContextLoss?.();
            document.getElementById("cells-background").replaceChildren(image);
            previewFrozen = true;
            window.chrome?.webview?.postMessage("preview-frozen");
          } catch (_) {
            cancelAnimationFrame(cells.req);
            cells.__cheemsPaused = true;
            window.chrome?.webview?.postMessage("preview-frozen");
          }
        });
      }, 200);
    }

    document.addEventListener("click", function () {
      if (window.chrome && window.chrome.webview) {
        window.chrome.webview.postMessage("apply-background");
      }
    });

    // WPF 前景覆盖全窗口时，宿主直接调用此函数转发鼠标坐标。
    window.__cheemsSetPointer = function (x, y) {
      cells.triggerMouseMove(x, y);
    };

    window.__cheemsUpdate = function (settings) {
      if (previewFrozen) return;
      const color = Number.parseInt(settings.color.slice(1), 16);
      cells.setOptions({ color1: color, speed: settings.enabled ? settings.speed : 0 });
      if (settings.enabled && cells.__cheemsPaused) {
        cells.prevNow = performance.now();
        cells.req = requestAnimationFrame(cells.animationLoop);
        cells.__cheemsPaused = false;
      } else if (!settings.enabled) {
        cancelAnimationFrame(cells.req);
        cells.__cheemsPaused = true;
      }
    };

    window.addEventListener("beforeunload", function () {
      cells.destroy();
    });
  </script>
</body>
</html>
