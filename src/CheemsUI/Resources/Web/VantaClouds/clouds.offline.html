<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Vanta CLOUDS · Offline</title>
  <style>
    html, body, #clouds-background { width: 100%; height: 100%; margin: 0; overflow: hidden; }
  </style>
</head>
<body>
  <div id="clouds-background"></div>
  <!-- 本页只引用同目录的本地副本；运行时不访问 CDN 或其他网络资源。 -->
  <script src="three.r134.min.js"></script>
  <script src="vanta.clouds.min.js"></script>
  <script>
    const isPreview = new URLSearchParams(location.search).has("preview");
    const clouds = VANTA.CLOUDS({
      el: "#clouds-background",
      mouseControls: true,
      touchControls: true,
      gyroControls: false,
      minHeight: 200.00,
      minWidth: 200.00,
      // 使用 Vanta 自己的渲染缩放机制；只改变内部着色分辨率，不改变效果参数。
      scale: isPreview ? 6.00 : 3.00,
      scaleMobile: isPreview ? 6.00 : 3.00
    });

    document.addEventListener("click", function () {
      if (window.chrome && window.chrome.webview) {
        window.chrome.webview.postMessage("apply-background");
      }
    });

    // WPF 前景覆盖全窗口时，宿主直接调用此函数转发鼠标坐标。
    window.__cheemsSetPointer = function (x, y) {
      clouds.triggerMouseMove(x, y);
    };

    if (window.chrome && window.chrome.webview) {
      window.chrome.webview.addEventListener("message", function (event) {
        const message = event.data;
        if (message && message.type === "pointer") {
          clouds.triggerMouseMove(message.x, message.y);
        }
      });
    }

    window.__cheemsUpdate = function (settings) {
      const parseColor = value => Number.parseInt(value.slice(1), 16);
      const renderScaleChanged = clouds.options.scale !== settings.renderScale;
      clouds.setOptions({
        skyColor: parseColor(settings.skyColor),
        cloudColor: parseColor(settings.cloudColor),
        cloudShadowColor: parseColor(settings.cloudShadowColor),
        sunColor: parseColor(settings.sunColor),
        sunGlareColor: parseColor(settings.sunGlareColor),
        sunlightColor: parseColor(settings.sunlightColor),
        speed: settings.enabled ? settings.speed : 0,
        scale: settings.renderScale,
        scaleMobile: settings.renderScale
      });
      if (renderScaleChanged) {
        clouds.resize();
      }
      if (settings.enabled && clouds.__cheemsPaused) {
        clouds.prevNow = performance.now();
        clouds.req = requestAnimationFrame(clouds.animationLoop);
        clouds.__cheemsPaused = false;
      } else if (!settings.enabled) {
        cancelAnimationFrame(clouds.req);
        clouds.__cheemsPaused = true;
      }
    };

    window.addEventListener("beforeunload", function () {
      clouds.destroy();
    });
  </script>
</body>
</html>
